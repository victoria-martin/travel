<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voyage Toscane</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --paper:#F1E9D8;
    --paper-raised:#FAF5EA;
    --ink:#24312B;
    --ink-soft:#5B6660;
    --line:#D9CFB8;
    --stone:#3E6259;
    --stone-dark:#2C4740;
    --ochre:#C98A3E;
    --rust:#A6462E;
    --sage:#7C8B5E;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px; flex-shrink:0;
    background:var(--stone-dark);
    color:var(--paper-raised);
    padding:28px 18px;
    display:flex; flex-direction:column; gap:6px;
  }
  .brand{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:26px;
    line-height:1.15;
    margin:0 0 4px 2px;
    color:var(--paper-raised);
  }
  .brand-sub{
    font-size:11px; letter-spacing:.03em; color:#B9C7C0; margin:0 0 26px 2px;
  }
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; text-align:left;
    color:#D8E2DC; font-family:inherit; font-size:14.5px;
    padding:10px 12px; border-radius:8px; cursor:pointer;
    transition:background .15s ease;
  }
  .nav-btn:hover{background:rgba(255,255,255,.08);}
  .nav-btn.active{background:var(--paper-raised); color:var(--stone-dark); font-weight:600;}
  .nav-icon{font-size:16px; width:18px; text-align:center;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:32px 40px; max-width:1180px;}
  .view-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .view-title{font-family:'Fraunces', serif; font-weight:600; font-size:28px; margin:0;}
  .view-sub{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}

  .btn{
    font-family:inherit; font-size:13.5px; font-weight:600;
    border:1px solid var(--stone); background:var(--stone); color:var(--white);
    padding:9px 16px; border-radius:7px; cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .btn:hover{background:var(--stone-dark);}
  .btn:active{transform:scale(.98);}
  .btn-ghost{background:transparent; color:var(--stone-dark); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-raised);}
  .btn-danger{background:transparent; color:var(--rust); border:1px solid var(--rust);}
  .btn-danger:hover{background:var(--rust); color:var(--white);}
  .btn-small{padding:5px 10px; font-size:12px;}

  .toggle-group{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .toggle-group button{
    font-family:inherit; font-size:13px; font-weight:500; background:var(--paper-raised);
    border:none; padding:7px 14px; cursor:pointer; color:var(--ink-soft);
  }
  .toggle-group button.active{background:var(--stone); color:var(--white);}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; padding:11px 14px; background:#EDE4D0; color:var(--ink-soft);
    font-weight:600; font-size:12px; border-bottom:1px solid var(--line);
  }
  td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#F6EFE0;}
  .tag{
    display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px;
    color:var(--white);
  }
  .tag-hotel{background:var(--rust);}
  .tag-home{background:var(--sage);}

  /* ---------- Cards ---------- */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:12px;
    padding:16px; display:flex; flex-direction:column; gap:8px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-name{font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin:0;}
  .card-meta{font-size:12.5px; color:var(--ink-soft); display:flex; flex-direction:column; gap:2px;}
  .card-actions{display:flex; gap:6px; margin-top:6px;}

  .empty-state{
    border:1px dashed var(--line); border-radius:10px; padding:40px 20px; text-align:center;
    color:var(--ink-soft); background:var(--paper-raised);
  }
  .empty-state strong{display:block; color:var(--ink); font-family:'Fraunces',serif; font-size:17px; margin-bottom:6px;}

  /* ---------- Form / Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(36,49,43,.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper-raised); border-radius:14px; padding:26px; width:100%; max-width:480px;
    max-height:88vh; overflow-y:auto; border:1px solid var(--line);
  }
  .modal h3{font-family:'Fraunces',serif; margin:0 0 16px 0; font-size:20px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:13.5px; padding:8px 10px;
    border:1px solid var(--line); border-radius:7px; background:var(--white); color:var(--ink);
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  /* ---------- Scenarios ---------- */
  .scenario-list{display:flex; flex-direction:column; gap:10px;}
  .scenario-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; padding:14px 18px; cursor:pointer;
  }
  .scenario-row:hover{border-color:var(--stone);}
  .scenario-row h4{margin:0 0 3px 0; font-family:'Fraunces',serif; font-size:16px;}
  .scenario-row span{font-size:12.5px; color:var(--ink-soft);}

  .step-list{display:flex; flex-direction:column; gap:10px; margin:18px 0;}
  .step-card{
    display:flex; gap:12px; align-items:flex-start; background:var(--paper-raised);
    border:1px solid var(--line); border-radius:10px; padding:12px 16px;
  }
  .step-order{
    width:26px; height:26px; border-radius:50%; background:var(--stone); color:var(--white);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;
  }
  .step-body{flex:1;}
  .step-title{font-weight:600; font-size:14.5px;}
  .step-detail{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .step-actions{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:6px; width:26px; height:26px;
    cursor:pointer; color:var(--ink-soft); font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{background:var(--paper); color:var(--ink);}

  /* ---------- Map ---------- */
  .map-layout{display:flex; gap:20px; align-items:flex-start;}
  .map-filters{
    width:250px; flex-shrink:0; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:12px; padding:18px;
  }
  .filter-block{margin-bottom:20px;}
  .filter-block:last-child{margin-bottom:0;}
  .filter-title{font-size:12px; font-weight:700; text-transform:none; color:var(--ink-soft); margin-bottom:8px; letter-spacing:.02em;}
  .filter-option{display:flex; align-items:center; gap:8px; font-size:13.5px; padding:4px 0; cursor:pointer;}
  .filter-option input{accent-color:var(--stone);}
  #map{height:600px; border-radius:12px; border:1px solid var(--line); flex:1;}
  .legend-dot{width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}

  @media (max-width:900px){
    #app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:16px;}
    .brand,.brand-sub{display:none;}
    .main{padding:20px;}
    .map-layout{flex-direction:column;}
    .map-filters{width:100%;}
  }
</style>

let state = null;
let view = "hebergements"; // hebergements | voitures | charges | scenarios | scenario-detail | carte

/* ============================= STORAGE (version GitHub Pages) ============================= */
/*
  Source de vérité "committée" : data.json (dans le repo, à côté de index.html).
  Modifs en cours : sauvegardées automatiquement dans le navigateur (localStorage) —
  visibles uniquement sur cet ordinateur/navigateur, tant que tu n'as pas exporté
  et recommité data.json dans le repo.
*/

async function loadData(){
  const local = readLocalStorage();
  if(local){
    state = local;
    render();
    return;
  }
  try{
    const res = await fetch('data.json', {cache:'no-store'});
    if(!res.ok) throw new Error('data.json introuvable');
    state = await res.json();
  }catch(e){
    console.warn("Impossible de charger data.json, utilisation des données par défaut.", e);
    state = defaultData();
  }
  render();
}

function readLocalStorage(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ persist(); schedulePush(); }, 300);
}

function persist(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(state));
  }catch(e){
    console.error("Erreur de sauvegarde locale", e);
  }
}

function exportDataJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importDataJsonFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = parsed;
      persist();
      render();
      alert("Données importées depuis le fichier.");
    }catch(err){
      alert("Ce fichier n'est pas un JSON valide.");
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function resetToCommittedData(){
  if(!confirm("Repartir de data.json effacera tes modifications locales non exportées. Continuer ?")) return;
  localStorage.removeItem(LOCAL_KEY);
  loadData();
}

/* ============================= SYNCHRO GOOGLE SHEETS ============================= */
/*
  Le Google Sheet (via l'Apps Script de apps-script/Code.gs) devient la source de vérité
  partagée. localStorage reste le cache local : l'app marche hors ligne, et tout ce qui
  a été modifié pendant la coupure est renvoyé au Sheet à la reconnexion.
  `sync.base` = dernier état reçu du Sheet, ce qui permet de fusionner entrée par entrée
  au lieu d'écraser le travail de l'autre.
*/

const SYNC_URL_KEY = "voyage-toscane-sync-url";
const SYNC_BASE_KEY = "voyage-toscane-sync-base";
const POLL_MS = 5000;
const PUSH_DEBOUNCE_MS = 900;

let sync = {
  url: "",
  rev: null,
  base: null,
  status: "off", // off | pulling | pushing | ok | error | choice
  message: "",
  pushTimer: null,
  pollTimer: null,
  busy: false,
  dirty: false,
  pendingRemote: null,
};

function syncActive(){ return !!sync.url; }

function loadSyncConfig(){
  try{
    sync.url = localStorage.getItem(SYNC_URL_KEY) || "";
    const raw = localStorage.getItem(SYNC_BASE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      sync.base = parsed.data || null;
      sync.rev = parsed.rev || null;
    }
  }catch(e){ /* config illisible : on repart sans synchro */ }
}

function saveSyncBase(rev, data){
  sync.rev = rev;
  sync.base = deepClone(data);
  try{ localStorage.setItem(SYNC_BASE_KEY, JSON.stringify({rev, data})); }catch(e){}
}

function clearSyncBase(){
  sync.rev = null;
  sync.base = null;
  try{ localStorage.removeItem(SYNC_BASE_KEY); }catch(e){}
}

function setSyncStatus(status, message){
  sync.status = status;
  sync.message = message || "";
  const el = document.getElementById('sync-status');
  if(el) el.outerHTML = syncStatusHtml();
}

function syncStatusHtml(){
  const labels = {
    off: ["⚪", "Local seulement"],
    pulling: ["🔄", "Lecture du Sheet…"],
    pushing: ["🔄", "Envoi au Sheet…"],
    ok: ["🟢", "Sheet synchronisé"],
    choice: ["🟠", "Choix à faire"],
    error: ["🔴", sync.message || "Sheet injoignable"],
  };
  const [icon, label] = labels[sync.status] || labels.off;
  return `<button class="nav-btn" id="sync-status" onclick="openSyncModal()" title="${escapeHtml(sync.message)}">
    <span class="nav-icon">${icon}</span>${escapeHtml(label)}
  </button>`;
}

function deepClone(value){ return JSON.parse(JSON.stringify(value)); }
function sameJson(a, b){ return JSON.stringify(a) === JSON.stringify(b); }

/* ------------------------------ appels réseau ------------------------------ */

async function sheetGet(){
  const res = await fetch(sync.url, {method:'GET', redirect:'follow'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return parseSheetResponse(await res.text());
}

async function sheetPost(payload){
  // Content-Type text/plain : évite la requête OPTIONS de préflight, qu'Apps Script ne gère pas.
  const res = await fetch(sync.url, {
    method: 'POST',
    redirect: 'follow',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload),
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return parseSheetResponse(await res.text());
}

function parseSheetResponse(text){
  let payload;
  try{
    payload = JSON.parse(text);
  }catch(e){
    throw new Error("Réponse inattendue : vérifie que l'URL finit par /exec et que l'accès est « tout le monde »");
  }
  if(payload.error) throw new Error(payload.error);
  return payload;
}

/* ------------------------------ fusion 3 voies ------------------------------ */

function mergeCollections(remote, local, base, mergeItem){
  const index = arr => new Map((arr||[]).map(x=>[x.id, x]));
  const localById = index(local), baseById = index(base);
  const out = [];
  const taken = new Set();

  (remote||[]).forEach(r=>{
    const l = localById.get(r.id);
    const b = baseById.get(r.id);
    if(!l){
      if(b) return;            // supprimé ici depuis le dernier sync
      out.push(r);             // ajouté là-bas
      taken.add(r.id);
      return;
    }
    const localChanged = !b || !sameJson(l, b);
    out.push(mergeItem ? mergeItem(r, l, b, localChanged) : (localChanged ? l : r));
    taken.add(r.id);
  });

  (local||[]).forEach(l=>{
    if(taken.has(l.id)) return;
    if(baseById.has(l.id)) return; // supprimé là-bas
    out.push(l);                   // ajouté ici
  });

  return out;
}

function withoutSteps(scenario){
  const {steps, ...rest} = scenario || {};
  return rest;
}

// Le nom du scénario et ses étapes se fusionnent séparément : toucher une étape
// ne doit pas écraser un renommage venu du Sheet.
function mergeScenario(remoteScenario, localScenario, baseScenario){
  const ownFieldsChanged = !baseScenario || !sameJson(withoutSteps(localScenario), withoutSteps(baseScenario));
  const merged = deepClone(ownFieldsChanged ? withoutSteps(localScenario) : withoutSteps(remoteScenario));
  merged.steps = mergeCollections(remoteScenario.steps || [], localScenario.steps || [], (baseScenario && baseScenario.steps) || []);
  return merged;
}

function mergeStates(remote, local, base){
  base = base || {};
  const importsDone = {...(remote.importsDone||{})};
  Object.keys(local.importsDone||{}).forEach(k=>{ if(local.importsDone[k]) importsDone[k] = true; });
  return {
    accommodations: mergeCollections(remote.accommodations, local.accommodations, base.accommodations),
    cars: mergeCollections(remote.cars, local.cars, base.cars),
    fixedCosts: mergeCollections(remote.fixedCosts, local.fixedCosts, base.fixedCosts),
    scenarios: mergeCollections(remote.scenarios, local.scenarios, base.scenarios, mergeScenario),
    importsDone,
  };
}

function isEmptyState(data){
  if(!data) return true;
  return ['accommodations','cars','fixedCosts','scenarios'].every(k => !(data[k]||[]).length);
}

/* ------------------------------ pull / push ------------------------------ */

async function pullFromSheet({silent = false} = {}){
  if(!syncActive() || sync.busy) return;
  sync.busy = true;
  if(!silent) setSyncStatus('pulling');
  try{
    const {rev, data} = await sheetGet();
    if(rev === sync.rev){
      setSyncStatus('ok');
      return;
    }
    applyRemote(rev, data);
  }catch(e){
    setSyncStatus('error', e.message);
  }finally{
    sync.busy = false;
  }
}

function applyRemote(rev, data){
  const merged = sync.base ? mergeStates(data, state, sync.base) : data;
  const needsPush = !sameJson(merged, data);
  state = merged;
  persist();
  saveSyncBase(rev, data);
  setSyncStatus('ok');
  if(!modal) render();
  if(needsPush) schedulePush();
}

function schedulePush(){
  if(!syncActive()) return;
  sync.dirty = true;
  clearTimeout(sync.pushTimer);
  sync.pushTimer = setTimeout(pushToSheet, PUSH_DEBOUNCE_MS);
}

async function pushToSheet(){
  if(!syncActive() || sync.busy) {
    if(syncActive()) schedulePush();
    return;
  }
  sync.busy = true;
  setSyncStatus('pushing');
  try{
    let payload = await sheetPost({action:'push', baseRev: sync.rev, data: state});
    if(payload.conflict){
      // Le Sheet a bougé : on fusionne entrée par entrée, puis on renvoie.
      state = mergeStates(payload.data, state, sync.base);
      persist();
      saveSyncBase(payload.rev, payload.data);
      if(!modal) render();
      payload = await sheetPost({action:'push', baseRev: sync.rev, data: state});
      if(payload.conflict) throw new Error("Le Sheet change en même temps, nouvelle tentative dans un instant");
    }
    state = payload.data;
    persist();
    saveSyncBase(payload.rev, payload.data);
    sync.dirty = false;
    setSyncStatus('ok');
    if(!modal) render();
  }catch(e){
    setSyncStatus('error', e.message);
    sync.pushTimer = setTimeout(pushToSheet, 15000);
  }finally{
    sync.busy = false;
  }
}

function startPolling(){
  clearInterval(sync.pollTimer);
  if(!syncActive()) return;
  sync.pollTimer = setInterval(()=>{
    if(document.hidden || modal || sync.dirty) return;
    pullFromSheet({silent:true});
  }, POLL_MS);
}

async function initSync(){
  if(!syncActive()){ setSyncStatus('off'); return; }
  setSyncStatus('pulling');
  try{
    const {rev, data} = await sheetGet();
    if(isEmptyState(data) && !isEmptyState(state)){
      // Sheet vierge : on l'amorce avec ce qu'on a en local.
      saveSyncBase(rev, data);
      await pushToSheet();
    }else if(!sync.base && !isEmptyState(state) && !sameJson(state, data)){
      // Première connexion avec des données des deux côtés : à elle de trancher.
      sync.pendingRemote = {rev, data};
      setSyncStatus('choice', "Données locales et Sheet différents");
      openSyncModal();
    }else{
      applyRemote(rev, data);
    }
  }catch(e){
    setSyncStatus('error', e.message);
  }
  startPolling();
}

/* ------------------------------ réglages ------------------------------ */

function openSyncModal(){
  modal = {type:'sync', payload:{}};
  render();
}

function syncForm(){
  const choice = sync.status === 'choice' && sync.pendingRemote;
  return `
    <h3>Synchro Google Sheets</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:-8px;">
      Colle l'URL de ton application web Apps Script (celle qui finit par <strong>/exec</strong>).
      Voir <strong>apps-script/Code.gs</strong> et le README pour la mise en place.
    </p>
    <div class="field">
      <label>URL de l'application web</label>
      <input id="sync-url" type="text" value="${escapeHtml(sync.url)}" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <p style="font-size:12.5px; color:var(--ink-soft);">
      État : ${escapeHtml(sync.message || sync.status)}
    </p>
    ${choice ? `
      <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:4px;">
        <p style="font-size:13px;"><strong>Tes données locales et celles du Sheet diffèrent.</strong> Que garde-t-on comme point de départ ?</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" onclick="resolveSyncChoice('remote')">Prendre le Sheet</button>
          <button class="btn btn-ghost" onclick="resolveSyncChoice('local')">Envoyer mes données locales</button>
        </div>
      </div>` : ''}
    <div class="modal-actions">
      ${syncActive() ? `<button class="btn btn-danger" onclick="disconnectSync()">Déconnecter</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn" onclick="saveSyncUrl()">Connecter</button>
    </div>
  `;
}

function saveSyncUrl(){
  const url = document.getElementById('sync-url').value.trim();
  if(url && !/^https:\/\/script\.google\.com\/.*\/exec$/.test(url)){
    if(!confirm("Cette URL ne ressemble pas à une application web Apps Script (/exec). Continuer quand même ?")) return;
  }
  const changed = url !== sync.url;
  sync.url = url;
  try{
    if(url) localStorage.setItem(SYNC_URL_KEY, url);
    else localStorage.removeItem(SYNC_URL_KEY);
  }catch(e){}
  if(changed) clearSyncBase();
  sync.pendingRemote = null;
  closeModal();
  initSync();
}

function resolveSyncChoice(side){
  const pending = sync.pendingRemote;
  if(!pending) return;
  sync.pendingRemote = null;
  closeModal();
  if(side === 'remote'){
    clearSyncBase();
    applyRemote(pending.rev, pending.data);
  }else{
    // base = état du Sheet : tout ce qui diffère en local gagne, le reste du Sheet est retiré.
    saveSyncBase(pending.rev, pending.data);
    schedulePush();
  }
  startPolling();
}

function disconnectSync(){
  if(!confirm("Arrêter la synchro avec le Sheet ? Tes données restent dans ce navigateur.")) return;
  clearInterval(sync.pollTimer);
  clearTimeout(sync.pushTimer);
  sync.url = "";
  sync.pendingRemote = null;
  try{ localStorage.removeItem(SYNC_URL_KEY); }catch(e){}
  clearSyncBase();
  setSyncStatus('off');
  closeModal();
}

/* ============================= HELPERS ============================= */

function getAccommodation(id){ return state.accommodations.find(a=>a.id===id); }
function getScenario(id){ return state.scenarios.find(s=>s.id===id); }

function distinctRegions(){
  const set = new Set();
  state.accommodations.forEach(a=>{ if(a.region) set.add(a.region); });
  return Array.from(set).sort();
}

function coordsFor(step){
  const acc = step.accommodationId ? getAccommodation(step.accommodationId) : null;
  if(acc && acc.lat && acc.lng) return [parseFloat(acc.lat), parseFloat(acc.lng)];
  if(CITY_PRESETS[step.city]) return CITY_PRESETS[step.city];
  return null;
}

function escapeHtml(str){
  if(str===undefined || str===null) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

          <select onchange="setStepAccommodation('${scenario.id}','${step.id}', this.value)" style="font-size:12.5px; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--white);">
            <option value="">— Aucun hébergement choisi —</option>
            ${state.accommodations.map(a=>`<option value="${a.id}" ${step.accommodationId===a.id?'selected':''}>${a.type==='hotel'?'🏨':'🔁'} ${escapeHtml(a.name)} (${escapeHtml(a.city)})</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="step-actions">
        <button class="icon-btn" onclick="moveStep('${scenario.id}','${step.id}',-1)" title="Monter">↑</button>
        <button class="icon-btn" onclick="moveStep('${scenario.id}','${step.id}',1)" title="Descendre">↓</button>
        <button class="icon-btn" onclick="openModal('step','${scenario.id}','${step.id}')" title="Modifier">✎</button>
        <button class="icon-btn" onclick="deleteStep('${scenario.id}','${step.id}')" title="Supprimer">🗑</button>
      </div>
    </div>
  `;
}

function renameScenario(id, name){
  const s = getScenario(id);
  s.name = name.trim() || s.name;
  scheduleSave();
}

function moveStep(scenarioId, stepId, dir){
  const s = getScenario(scenarioId);
  const i = s.steps.findIndex(st=>st.id===stepId);
  const j = i+dir;
  if(j<0 || j>=s.steps.length) return;
  [s.steps[i], s.steps[j]] = [s.steps[j], s.steps[i]];
  scheduleSave();
  render();
}

function deleteStep(scenarioId, stepId){
  const s = getScenario(scenarioId);
  s.steps = s.steps.filter(st=>st.id!==stepId);
  scheduleSave();
  render();
}

function setStepAccommodation(scenarioId, stepId, accId){
  const s = getScenario(scenarioId);
  const st = s.steps.find(x=>x.id===stepId);
  st.accommodationId = accId || null;
  scheduleSave();
}

/* ============================= MAP ============================= */

function renderMapView(){
  const regions = distinctRegions();
  return `
    <div class="view-header">
      <div>
        <h2 class="view-title">Carte</h2>
        <p class="view-sub">Filtre par type, région ou scénario</p>
      </div>
    </div>
    <div class="map-layout">
      <div class="map-filters">
        <div class="filter-block">
          <div class="filter-title">Type de liste</div>
          <label class="filter-option"><input type="checkbox" ${mapFilters.hotel?'checked':''} onchange="toggleMapType('hotel')"><span class="legend-dot" style="background:var(--rust);"></span>Hôtels</label>
          <label class="filter-option"><input type="checkbox" ${mapFilters.homeExchange?'checked':''} onchange="toggleMapType('homeExchange')"><span class="legend-dot" style="background:var(--sage);"></span>Home exchange</label>
        </div>
        <div class="filter-block">
          <div class="filter-title">Région</div>
          ${regions.length===0 ? `<div style="font-size:12.5px; color:var(--ink-soft);">Ajoute une région à tes hébergements pour filtrer ici.</div>` :
            regions.map(r=>`<label class="filter-option"><input type="checkbox" ${mapFilters.regions.has(r)||mapFilters.regions.size===0?'checked':''} onchange="toggleMapRegion('${escapeHtml(r)}')">${escapeHtml(r)}</label>`).join('')}
        </div>
        <div class="filter-block">
          <div class="filter-title">Favoris</div>
          <label class="filter-option"><input type="checkbox" ${mapFilters.favOnly?'checked':''} onchange="toggleMapFavOnly()">⭐ Favoris uniquement</label>
        </div>
        <div class="filter-block">
          <div class="filter-title">Scénario</div>
          <select onchange="setMapScenario(this.value)" style="width:100%; font-size:13px; padding:7px 9px; border:1px solid var(--line); border-radius:7px;">
            <option value="">Tous les hébergements</option>
            ${state.scenarios.map(s=>`<option value="${s.id}" ${mapFilters.scenarioId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
          </select>
          <div style="font-size:12px; color:var(--ink-soft); margin-top:8px;">
            Choisir un scénario trace son trajet et n'affiche que les hébergements qu'il utilise.
          </div>
        </div>
      </div>
      <div id="map"></div>
    </div>
  `;
}

function toggleMapType(t){
  mapFilters[t] = !mapFilters[t];
  render(); setTimeout(initMap,30);
}
function toggleMapRegion(r){
  if(mapFilters.regions.has(r)) mapFilters.regions.delete(r);
  else {
    // if nothing was excluded yet (size 0 = "all"), start explicit set with everything except r
    if(mapFilters.regions.size===0){
      distinctRegions().forEach(x=>mapFilters.regions.add(x));
    }
    mapFilters.regions.delete(r);
  }
  render(); setTimeout(initMap,30);
}
function toggleMapFavOnly(){
  mapFilters.favOnly = !mapFilters.favOnly;
  render(); setTimeout(initMap,30);
}
function setMapScenario(id){
  mapFilters.scenarioId = id || null;
  render(); setTimeout(initMap,30);
}

function initMap(){
  const el = document.getElementById("map");
  if(!el || typeof L === "undefined") return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }

  leafletMap = L.map('map').setView([44.3, 9.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(leafletMap);

  const regionFilterActive = mapFilters.regions.size > 0;
  let scenarioAccIds = null;

  if(mapFilters.scenarioId){
    const s = getScenario(mapFilters.scenarioId);
    if(s){
      scenarioAccIds = new Set(s.steps.map(st=>st.accommodationId).filter(Boolean));
      const linePoints = s.steps.map(coordsFor).filter(Boolean);
      if(linePoints.length>1){
        L.polyline(linePoints, {color:'#3E6259', weight:3, dashArray:'6 6'}).addTo(leafletMap);
      }
      s.steps.forEach((st,idx)=>{
        const c = coordsFor(st);
        if(c){
          L.circleMarker(c, {radius:7, color:'#24312B', weight:1, fillColor:'#C98A3E', fillOpacity:0.95})
            .bindPopup(`<strong>${escapeHtml(st.city)}</strong><br/>Étape ${idx+1}${st.nights?` · ${st.nights} nuit(s)`:''}`)
            .addTo(leafletMap);
        }
      });
    }
  }

  const bounds = [];
  state.accommodations.forEach(a=>{
    if(!a.lat || !a.lng) return;
    if(a.type==='hotel' && !mapFilters.hotel) return;
    if(a.type==='homeExchange' && !mapFilters.homeExchange) return;
    if(regionFilterActive && a.region && mapFilters.regions.has(a.region)===false) return;
    if(scenarioAccIds && !scenarioAccIds.has(a.id)) return;
    if(mapFilters.favOnly && !a.favorite) return;

    const color = a.type==='hotel' ? '#A6462E' : '#7C8B5E';
    const c = [parseFloat(a.lat), parseFloat(a.lng)];
    bounds.push(c);
    L.circleMarker(c, {radius:8, color:'#24312B', weight:1, fillColor:color, fillOpacity:0.9})
      .bindPopup(`<strong>${a.favorite?'★ ':''}${escapeHtml(a.name)}</strong><br/>${a.type==='hotel'?'Hôtel':'Home exchange'} · ${escapeHtml(a.city)}${a.price?`<br/>${escapeHtml(a.price)} €`:''}`)
      .addTo(leafletMap);
  });

  if(bounds.length>0){
    leafletMap.fitBounds(bounds, {padding:[40,40]});
  }
}

/* ============================= MODAL / FORMS ============================= */

function setListMode(kind, mode){
  listViewMode[kind] = mode;
  render();
}

function openModal(type, a, b){
  if(type==='accommodation'){
    modal = {type, payload: a ? {...getAccommodation(a)} : {id:null, type:'hotel', name:'', city:'', region:'', lat:'', lng:'', price:'', dates:'', link:'', notes:'', favorite:false}};
  } else if(type==='voitures' || type==='charges'){
    const cfg = SIMPLE_CONFIG[type];
    const existing = a ? state[cfg.dataKey].find(x=>x.id===a) : null;
    const empty = {id:null};
    cfg.fields.forEach(f=>empty[f.key]='');
    modal = {type, payload: existing ? {...existing} : empty};
  } else if(type==='step'){
    const scenarioId = a;
    const stepId = b;
    const s = getScenario(scenarioId);
    const existing = stepId ? s.steps.find(x=>x.id===stepId) : null;
    modal = {type, scenarioId, payload: existing ? {...existing} : {id:null, city:'', region:'', arrivalDate:'', nights:1, accommodationId:null, notes:''}};
  }
  render();
}

function openPasteImport(){
  modal = {type:'paste-import', payload:{text:''}};
  render();
}

function closeModal(){ modal=null; render(); }

function renderModal(){
  const container = document.createElement('div');
  container.className = 'overlay';
  container.onclick = (e)=>{ if(e.target===container) closeModal(); };

  let bodyHtml = '';
  if(modal.type==='accommodation') bodyHtml = accommodationForm(modal.payload);
  else if(modal.type==='voitures' || modal.type==='charges') bodyHtml = simpleForm(modal.type, modal.payload);
  else if(modal.type==='step') bodyHtml = stepForm(modal.payload);
  else if(modal.type==='paste-import') bodyHtml = pasteImportForm();
  else if(modal.type==='sync') bodyHtml = syncForm();

  container.innerHTML = `<div class="modal" style="${modal.type==='paste-import'?'max-width:640px;':''}">${bodyHtml}</div>`;
  document.getElementById('app').appendChild(container);
}

function pasteImportForm(){
  return `
    <h3>Importer depuis un tableau</h3>
    <p style="font-size:13px; color:var(--ink-soft); margin-top:-8px;">
      Dans Google Sheets ou Excel, mets tes colonnes dans cet ordre (une ligne par hébergement) :
      <br><strong>Type · Nom · Ville · Région · Prix · Dates · Lien · Notes</strong><br>
      Type accepte "hotel" ou "home exchange" (par défaut : hôtel). Sélectionne tes lignes, copie (Ctrl+C), puis colle ci-dessous.
    </p>
    <div class="field"><textarea id="paste-area" rows="10" placeholder="hotel	Antico Casale	Sarzana	Ligurie	152	21/09	https://...	Super, pack remboursable" style="font-family:monospace; font-size:12px;"></textarea></div>
    <div id="paste-preview" style="font-size:12.5px; color:var(--ink-soft);"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="runPasteImport()">Analyser et importer</button>
    </div>
  `;
}

function runPasteImport(){
  const raw = document.getElementById('paste-area').value;
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){ alert("Colle d'abord au moins une ligne."); return; }
  let added = 0;
  lines.forEach(line=>{
    const cells = line.split('\t').length>1 ? line.split('\t') : line.split(',');
    const [typeRaw, name, city, region, price, dates, link, notes] = cells.map(c=>(c||'').trim());
    if(!name && !city) return;
    const typeLower = (typeRaw||'').toLowerCase();
    const type = (typeLower.includes('home') || typeLower.includes('exchange') || typeLower.includes('échange')) ? 'homeExchange' : 'hotel';
    const preset = CITY_PRESETS[city];
    state.accommodations.push({
      id: uid(), type, name: name || city || 'Sans nom', city: city||'', region: region||'',
      lat: preset ? String(preset[0]) : '', lng: preset ? String(preset[1]) : '',
      price: price||'', dates: dates||'', link: link||'', notes: notes||'', favorite:false
    });
    added++;
  });
  scheduleSave();
  closeModal();
  alert(added + " hébergement(s) importé(s). Pense à vérifier/compléter les coordonnées GPS si besoin.");
  render();
}

function accommodationForm(p){
  const cityOptions = Object.keys(CITY_PRESETS).map(c=>`<option value="${c}" ${p.city===c?'selected':''}>${c}</option>`).join('');
  return `
    <h3>${p.id?'Modifier':'Ajouter'} un hébergement</h3>
    <div class="field-row">
      <div class="field"><label>Type</label>
        <select id="f-type"><option value="hotel" ${p.type==='hotel'?'selected':''}>Hôtel</option><option value="homeExchange" ${p.type==='homeExchange'?'selected':''}>Home exchange</option></select>
      </div>
      <div class="field"><label>Nom</label><input id="f-name" type="text" value="${escapeHtml(p.name)}" placeholder="Antico Casale"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Ville (preset coordonnées)</label>
        <select id="f-citypreset" onchange="applyCityPreset()"><option value="">— choisir —</option>${cityOptions}</select>
      </div>
      <div class="field"><label>Région (pour filtrer)</label><input id="f-region" type="text" value="${escapeHtml(p.region)}" placeholder="Sienne"></div>
    </div>
    <div class="field"><label>Ville (libre)</label><input id="f-city" type="text" value="${escapeHtml(p.city)}" placeholder="Sovicille"></div>
    <div class="field-row">
      <div class="field"><label>Latitude</label><input id="f-lat" type="text" value="${escapeHtml(p.lat)}" placeholder="43.28"></div>
      <div class="field"><label>Longitude</label><input id="f-lng" type="text" value="${escapeHtml(p.lng)}" placeholder="11.20"></div>
    </div>
    <div style="font-size:11.5px; color:var(--ink-soft); margin:-8px 0 14px 0;">Astuce : clic droit sur Google Maps → coordonnées → coller ici.</div>
    <div class="field-row">
      <div class="field"><label>Prix</label><input id="f-price" type="text" value="${escapeHtml(p.price)}" placeholder="120"></div>
      <div class="field"><label>Dates</label><input id="f-dates" type="text" value="${escapeHtml(p.dates)}" placeholder="12–14 juin"></div>
    </div>
    <div class="field"><label>Lien</label><input id="f-link" type="text" value="${escapeHtml(p.link)}" placeholder="https://..."></div>
    <div class="field"><label>Notes</label><textarea id="f-notes" rows="2">${escapeHtml(p.notes)}</textarea></div>
    <label class="filter-option" style="padding:0 0 6px 0;"><input type="checkbox" id="f-favorite" ${p.favorite?'checked':''}> ⭐ Coup de cœur</label>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="saveAccommodation('${p.id||''}')">Enregistrer</button>
    </div>
  `;
}

function applyCityPreset(){
  const val = document.getElementById('f-citypreset').value;
  if(val && CITY_PRESETS[val]){
    document.getElementById('f-city').value = val;
    document.getElementById('f-lat').value = CITY_PRESETS[val][0];
    document.getElementById('f-lng').value = CITY_PRESETS[val][1];
  }
}

function saveAccommodation(id){
  const item = {
    id: id || uid(),
    type: document.getElementById('f-type').value,
    name: document.getElementById('f-name').value.trim() || 'Sans nom',
    city: document.getElementById('f-city').value.trim(),
    region: document.getElementById('f-region').value.trim(),
    lat: document.getElementById('f-lat').value.trim(),
    lng: document.getElementById('f-lng').value.trim(),
    price: document.getElementById('f-price').value.trim(),
    dates: document.getElementById('f-dates').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    favorite: document.getElementById('f-favorite').checked,
  };
  if(id){
    const idx = state.accommodations.findIndex(a=>a.id===id);
    state.accommodations[idx] = item;
  } else {
    state.accommodations.push(item);
  }
  scheduleSave();
  closeModal();
}

function simpleForm(kind, p){
  const cfg = SIMPLE_CONFIG[kind];
  return `
    <h3>${p.id?'Modifier':'Ajouter'} — ${cfg.title}</h3>
    ${cfg.fields.map(f=> f.type==='textarea'
      ? `<div class="field"><label>${f.label}</label><textarea id="f-${f.key}" rows="2">${escapeHtml(p[f.key])}</textarea></div>`
      : `<div class="field"><label>${f.label}</label><input id="f-${f.key}" type="text" value="${escapeHtml(p[f.key])}"></div>`
    ).join('')}
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="saveSimple('${kind}','${p.id||''}')">Enregistrer</button>
    </div>
  `;
}

function saveSimple(kind, id){
  const cfg = SIMPLE_CONFIG[kind];
  const item = {id: id || uid()};
  cfg.fields.forEach(f=>{ item[f.key] = document.getElementById('f-'+f.key).value.trim(); });
  const arr = state[cfg.dataKey];
  if(id){
    const idx = arr.findIndex(x=>x.id===id);
    arr[idx] = item;
  } else {
    arr.push(item);
  }
  scheduleSave();
  closeModal();
}

function stepForm(p){
  const cityOptions = Object.keys(CITY_PRESETS).map(c=>`<option value="${c}" ${p.city===c?'selected':''}>${c}</option>`).join('');
  return `
    <h3>${p.id?'Modifier':'Ajouter'} une étape</h3>
    <div class="field"><label>Ville (preset)</label>
      <select id="s-citypreset" onchange="document.getElementById('s-city').value=this.value"><option value="">— libre —</option>${cityOptions}</select>
    </div>
    <div class="field"><label>Ville</label><input id="s-city" type="text" value="${escapeHtml(p.city)}" placeholder="Sienne"></div>
    <div class="field-row">
      <div class="field"><label>Région</label><input id="s-region" type="text" value="${escapeHtml(p.region)}"></div>
      <div class="field"><label>Nuits</label><input id="s-nights" type="number" min="0" value="${p.nights||0}"></div>
    </div>
    <div class="field"><label>Date d'arrivée</label><input id="s-date" type="text" value="${escapeHtml(p.arrivalDate)}" placeholder="12 juin"></div>
    <div class="field"><label>Notes</label><textarea id="s-notes" rows="2">${escapeHtml(p.notes)}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="saveStep('${p.id||''}')">Enregistrer</button>
    </div>
  `;
}

function saveStep(id){
  const s = getScenario(modal.scenarioId);
  const item = {
    id: id || uid(),
    city: document.getElementById('s-city').value.trim(),
    region: document.getElementById('s-region').value.trim(),
    nights: parseInt(document.getElementById('s-nights').value)||0,
    arrivalDate: document.getElementById('s-date').value.trim(),
    notes: document.getElementById('s-notes').value.trim(),
    accommodationId: id ? (s.steps.find(x=>x.id===id).accommodationId||null) : null,
  };
  if(id){
    const idx = s.steps.findIndex(x=>x.id===id);
    s.steps[idx] = item;
  } else {
    s.steps.push(item);
  }
  scheduleSave();
  closeModal();
}

function deleteItem(dataKey, id){
  if(!confirm("Supprimer cet élément ?")) return;
  state[dataKey] = state[dataKey].filter(x=>x.id!==id);
  scheduleSave();
  render();
}

function emptyState(title, sub){
  return `<div class="empty-state"><strong>${title}</strong>${sub}</div>`;
}

async function refreshData(){
  await loadData();
  if(view==="carte") setTimeout(initMap,30);
}

/* ============================= INIT ============================= */
loadSyncConfig();
loadData().then(initSync);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && syncActive() && !modal) pullFromSheet({silent:true}); });
</script>
